# Dlouhy trenink 1-bit transformeru v rezimu cipu (tools/bitlm/train_big.py), rozdeleny na useky po <6 h.
# Kazdy usek nacte checkpoint z predchoziho, trenuje ~5,1 h a checkpoint preda dalsimu.
# Vygenerovano: pocet useku = 8.
name: Big train
on:
  workflow_dispatch:
    inputs:
      name:
        description: "nazev behu (artefakty)"
        default: "m5"
      args:
        description: "argumenty train_big.py"
        default: "--d 256 --layers 6 --heads 8 --ff 1024 --steps 64000 --eval-every 2000"
      wiki_chars:
        default: "100000000"

env:
  TL: "18400"

jobs:
  s1:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zavislosti
        run: pip install -q --index-url https://download.pytorch.org/whl/cpu torch && pip install -q pyarrow
      - name: Stav
        id: st
        run: |
          mkdir -p out
          if [ -f out/${{ inputs.name }}.json ]; then echo "done=1" >> "$GITHUB_OUTPUT"; else echo "done=0" >> "$GITHUB_OUTPUT"; fi
      - name: Korpus (Wikipedie + knihy + R.U.R.)
        if: steps.st.outputs.done == '0'
        run: |
          curl -sL --retry 5 -o /tmp/cs0.parquet https://huggingface.co/api/datasets/wikimedia/wikipedia/parquet/20231101.cs/train/0.parquet
          python3 tools/bitlm/build_big_corpus.py data/cz_big.tok data/rur_cz_pg13083.txt data/cz/pg*.txt \
              --wiki /tmp/cs0.parquet --wiki-chars ${{ inputs.wiki_chars }} --book-repeat 4
      - name: Trenink (usek 1)
        if: steps.st.outputs.done == '0'
        run: |
          TORCH_THREADS=$(nproc) python3 tools/bitlm/train_big.py data/cz_big.tok ${{ inputs.args }} \
              --ckpt out/ckpt.pt --time-limit $TL --out out/${{ inputs.name }}.json 2>&1 | tee -a out/${{ inputs.name }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-s1
          path: out/
          retention-days: 30
